# Dependency inventory — machine-readable.
#
# Policy (Rationale_Arquitectura_Conceptual_v0.1.md §18.4, Proceso §19):
# every dependency must record its license, version, size, risk, purpose,
# alternatives considered, known CVEs, whether it can be vendored, whether it
# needs a runtime, and whether it adds external calls.
#
# ADR-0001 (Rust, status "proposed") is already implemented in the root
# Cargo.toml. The dependencies below reflect the REAL state of the `rationale`
# crate — not the spike (spikes/language/rust/ has its own Cargo.toml and
# separate dependencies; it is throwaway research code, not the starting point
# of the real core).
#
# External dependencies present in the development environment (not in
# Rationale's runtime) are documented as research/tooling, not as product
# dependencies:
#   - Codebase Memory (initial structural provider, an external process over MCP/CLI)
#   - Git
#
# The `rationale` Agent Skill (skills/rationale/) adds no crate. Its optional
# validator script uses only the Python standard library, and PyYAML when it is
# already installed; it is not a runtime dependency of the binary.

schema_version: 1
core_dependencies:
  - name: serde
    version: "1"
    license: "MIT OR Apache-2.0"
    purpose: "(De)serialization framework"
    runtime_dependency: true
    requires_network: false
  - name: serde_json
    version: "1"
    license: "MIT OR Apache-2.0"
    purpose: "Serialization of Context Packets and JSON-RPC messages of the MCP server"
    runtime_dependency: true
    requires_network: false
  - name: yaml_serde
    version: "0.10.4"
    license: "MIT OR Apache-2.0"
    purpose: "Parsing YAML Records, Subjects, Evidence, and Assessments in .rationale/"
    runtime_dependency: true
    requires_network: false
    notes: >
      Replaced serde_yaml (0.9, "+deprecated" upstream) in ADR-0003.
      Maintained by "The YAML Organization" (github.com/yaml/yaml-serde).
      Tested with a real round trip against a Subject from the repository
      before migrating. Brings one new transitive dependency: libyaml-rs 0.3.0
      (libyaml transpiled to pure Rust through c2rust, MIT, same github.com/yaml
      organization) — it does not reintroduce a C toolchain, confirmed by
      `cargo info`.
  - name: rusqlite
    version: "0.31 (feature: bundled)"
    license: "MIT"
    purpose: "Embedded SQLite for the derived layer (assessments, FTS5, cache) — ADR-0004"
    runtime_dependency: true
    requires_network: false
    vendorable: true
    notes: >
      Added in Phase E3 (src/cache.rs). Validated end to end in
      spikes/language/rust/ before moving it into the real core. `cargo audit`
      was run over the full tree — see the result in `security_audit` below.
  - name: sha2
    version: "0.10"
    license: "MIT OR Apache-2.0"
    purpose: "SHA-256 of the full content of every file install-agent owns (shortcut skills and the rationale skill); uninstall-agent deletes a file only while it keeps the recorded hash"
    runtime_dependency: true
    requires_network: false
    notes: >
      Avoids a non-cryptographic 64-bit hash at a destructive boundary. The
      comparison protects content the user edited: when the hash changes, the
      file is kept and reported.

# Transitive dependencies that matter for size or attack surface (not every
# crate in the tree — `cargo tree --edges normal` in the repository has the full list).
notable_transitive_dependencies:
  - name: libsqlite3-sys
    via: rusqlite
    license: "MIT"
    notes: "FFI bindings to SQLite (bundled, compiled from vendored source — it does not link against a system libsqlite3)."
  - name: libyaml-rs
    via: yaml_serde
    license: "MIT"
    notes: "libyaml transpiled to pure Rust (c2rust) — no additional C toolchain."
  - name: zerocopy
    via: "rusqlite -> hashlink -> hashbrown -> ahash"
    license: "BSD-2-Clause OR Apache-2.0 OR MIT"
    notes: "No unsafe exposed to Rationale directly; used internally by ahash."
  - name: digest
    via: sha2
    license: "MIT OR Apache-2.0"
    notes: "Traits and cryptographic buffering used by SHA-256; performs no I/O or external calls."

tooling_dependencies:
  - name: codebase-memory-mcp
    purpose: "Initial structural provider, consumed over MCP/CLI, never linked"
    runtime_dependency: false
    requires_network: false
    license: "to be verified in docs/research/codebase-memory/"
  - name: git
    purpose: "Source of truth for revision, history, and collaboration"
    runtime_dependency: true
    requires_network: false
    license: "GPL-2.0 (external tool, not linked)"

# Real result of `cargo audit` (see docs/runbooks/build-and-test.md for how to
# run it again). It closed the known gap `cargo-audit-not-installed` that had
# existed since Phase D — run in F0 before Phase F added more dependencies
# (canonical writes).
security_audit:
  tool: "cargo-audit 0.22.2"
  advisory_db: "RustSec/advisory-db, 1170 advisories loaded"
  crates_scanned: 46
  vulnerabilities_found: 0
  warnings: 0
  run_date: "2026-07-28"

known_gaps:
  - id: windows-file-locking-unexercised
    description: >
      Decision formalized in ADR-0008: an atomic rename is enough for the canon,
      and skills use a claim by rename plus no-clobber publication with a hard
      link; no real file locking is added. `rename` and `hard_link` pass in CI,
      but their guarantees under real multi-process contention on NTFS have not
      been exercised empirically. Not blocking until the Windows pilot.
    severity: low
