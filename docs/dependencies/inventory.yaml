# Inventario de dependencias — legible por máquina.
#
# Política (Rationale_Arquitectura_Conceptual_v0.1.md §18.4, Proceso §19):
# cada dependencia debe registrar licencia, versión, tamaño, riesgo, motivo,
# alternativas consideradas, CVEs conocidas, si puede vendorizarse, si
# requiere runtime, y si agrega llamadas externas.
#
# ADR-0001 (Rust, estado "proposed") ya está implementado en el Cargo.toml
# raíz. Las dependencias abajo reflejan el estado REAL del crate `rationale`
# tras Fase E completa (modelo canónico, capa derivada SQLite+FTS, Context
# Compiler, superficie MCP) — no el spike (spikes/language/rust/ tiene su
# propio Cargo.toml y dependencias separadas, código de investigación
# desechable, no el punto de partida del core real).
#
# Dependencias externas ya presentes en el entorno de desarrollo (no del
# runtime de Rationale) se documentan como research/tooling, no como
# dependencias del producto:
#   - Codebase Memory (proveedor estructural inicial, proceso externo vía MCP/CLI)
#   - Git

schema_version: 1
core_dependencies:
  - name: serde
    version: "1"
    license: "MIT OR Apache-2.0"
    purpose: "Framework de (de)serialización"
    runtime_dependency: true
    requires_network: false
  - name: serde_json
    version: "1"
    license: "MIT OR Apache-2.0"
    purpose: "Serialización de Context Packets y mensajes JSON-RPC del servidor MCP"
    runtime_dependency: true
    requires_network: false
  - name: yaml_serde
    version: "0.10.4"
    license: "MIT OR Apache-2.0"
    purpose: "Parseo de Records/Subjects/Evidence/Assessments YAML en .rationale/"
    runtime_dependency: true
    requires_network: false
    notes: >
      Reemplazó a serde_yaml (0.9, "+deprecated" upstream) en ADR-0003.
      Mantenido por "The YAML Organization" (github.com/yaml/yaml-serde).
      Probado con roundtrip real contra un Subject del repo antes de migrar.
      Trae una dependencia transitiva nueva: libyaml-rs 0.3.0 (libyaml
      transpilado a Rust puro vía c2rust, MIT, mismo org github.com/yaml)
      — no reintroduce un toolchain C, confirmado por `cargo info`.
  - name: rusqlite
    version: "0.31 (feature: bundled)"
    license: "MIT"
    purpose: "SQLite embebido para la capa derivada (assessments, FTS5, cache) — ADR-0004"
    runtime_dependency: true
    requires_network: false
    vendorable: true
    notes: >
      Añadido en Fase E3 (src/cache.rs). Validado end-to-end en
      spikes/language/rust/ antes de migrarlo al core real. `cargo audit`
      corrido sobre el árbol completo — ver resultado en `security_audit`
      abajo.
  - name: sha2
    version: "0.10"
    license: "MIT OR Apache-2.0"
    purpose: "SHA-256 del contenido íntegro de skills administrados; uninstall-agent solo borra un archivo si conserva el hash escrito"
    runtime_dependency: true
    requires_network: false
    notes: >
      Evita usar un hash de 64 bits no criptográfico en una frontera
      destructiva. La comparación protege contenido editado por el usuario:
      si el hash cambia, el skill se conserva y se reporta.

# Transitivas relevantes por tamaño o superficie de ataque (no cada crate
# del árbol — cargo tree --edges normal en el repo tiene la lista completa).
notable_transitive_dependencies:
  - name: libsqlite3-sys
    via: rusqlite
    license: "MIT"
    notes: "Bindings FFI a SQLite (bundled, compilado desde fuente vendorizada — no enlaza contra una libsqlite3 del sistema)."
  - name: libyaml-rs
    via: yaml_serde
    license: "MIT"
    notes: "libyaml transpilado a Rust puro (c2rust) — sin toolchain C adicional."
  - name: zerocopy
    via: "rusqlite -> hashlink -> hashbrown -> ahash"
    license: "BSD-2-Clause OR Apache-2.0 OR MIT"
    notes: "Sin unsafe expuesto a Rationale directamente; uso interno de ahash."
  - name: digest
    via: sha2
    license: "MIT OR Apache-2.0"
    notes: "Traits y buffering criptográfico usados por SHA-256; no realiza I/O ni llamadas externas."

tooling_dependencies:
  - name: codebase-memory-mcp
    purpose: "Proveedor estructural inicial, consumido vía MCP/CLI, nunca enlazado"
    runtime_dependency: false
    requires_network: false
    license: "por verificar en docs/research/codebase-memory/"
  - name: git
    purpose: "Fuente de verdad de revisión, historial y colaboración"
    runtime_dependency: true
    requires_network: false
    license: "GPL-2.0 (herramienta externa, no vinculada)"

# Resultado real de `cargo audit` (ver docs/runbooks/build-and-test.md para
# cómo re-ejecutarlo). Cierra el known_gap `cargo-audit-not-installed` que
# existía desde Fase D — corrido en F0 antes de que Fase F añada más
# dependencias (escritura canónica).
security_audit:
  tool: "cargo-audit 0.22.2"
  advisory_db: "RustSec/advisory-db, 1170 advisories cargados"
  crates_scanned: 46
  vulnerabilities_found: 0
  warnings: 0
  run_date: "2026-07-28"

known_gaps:
  - id: windows-file-locking-unexercised
    description: >
      Decisión formalizada en ADR-0008: rename atómico basta para el canon y
      los skills usan claim por rename + publicación no-clobber con hard link;
      no se añade file locking real. `rename` y `hard_link` pasan en CI, pero
      sus garantías bajo contención real de varios procesos en NTFS siguen sin
      ejercitarse empíricamente. No bloqueante hasta el piloto en Windows.
    severity: low
