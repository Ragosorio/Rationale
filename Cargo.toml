[package]
name = "rationale"
version = "0.0.0"
edition = "2021"
publish = false
description = "Rationale — local causal-context compiler and provenance layer for coding agents (vertical slice, Fase D)"

[[bin]]
name = "rationale"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
