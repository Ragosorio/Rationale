[package]
name = "rationale-spike"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "rationale-spike"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
