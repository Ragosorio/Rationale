name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    env:
      RATIONALE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            site/package-lock.json
      - run: test "$(cat docs/RELEASE_VERSION)" = "${GITHUB_REF_NAME}"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: ./scripts/check-docs.sh
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site

  package-unix:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            # macos-13 is retired on current GitHub-hosted runner pools.
            # macos-14 is Apple Silicon but clang can cross-link this Rust
            # target against the installed macOS SDK.
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      # `build.rs` embebe `ui/dist` en el binario; sin este paso la Release
      # publicaría la página de fallback de `rationale ui` en vez del Control
      # Room. Se construye antes de compilar y se exige que exista.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Control Room
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          test -f ui/dist/index.html
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          RATIONALE_VERSION: ${{ github.ref_name }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rationale-${{ matrix.target }}
          path: target/packages/*

  package-windows:
    name: Package Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Control Room
        shell: pwsh
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          if (!(Test-Path ui/dist/index.html)) { throw "ui/dist no se construyó: el binario serviría la página de fallback" }
      - name: Package
        shell: pwsh
        env:
          TARGET: x86_64-pc-windows-msvc
          RATIONALE_VERSION: ${{ github.ref_name }}
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rationale-x86_64-pc-windows-msvc
          path: target/packages/*

  publish:
    name: Publish GitHub Release
    needs: [package-unix, package-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add installers
        run: |
          mkdir -p release
          # Los scripts se publican tal cual están en el tag. Aquí hubo dos
          # `sed` que reescribían `DEFAULT_CHANNEL`; eran no-ops silenciosos que
          # sugerían una transformación inexistente. Desde 1.0 los scripts
          # declaran "stable" en el repo (ADR-0010).
          git show "${GITHUB_REF_NAME}:scripts/rationale-installer.sh" > release/rationale-installer.sh
          git show "${GITHUB_REF_NAME}:scripts/rationale-update.sh" > release/rationale-update.sh
          git show "${GITHUB_REF_NAME}:scripts/rationale-uninstall.sh" > release/rationale-uninstall.sh
          git show "${GITHUB_REF_NAME}:scripts/rationale-installer.ps1" > release/rationale-installer.ps1
          git show "${GITHUB_REF_NAME}:scripts/rationale-update.ps1" > release/rationale-update.ps1
          git show "${GITHUB_REF_NAME}:scripts/rationale-uninstall.ps1" > release/rationale-uninstall.ps1
          chmod +x release/rationale-installer.sh release/rationale-update.sh release/rationale-uninstall.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_assets < <(find release -type f -print)
          test "${#release_assets[@]}" -gt 0
          release_flags=(--title "Rationale ${GITHUB_REF_NAME}" --generate-notes)
          # GitHub solo marca «latest» una Release que NO sea prerelease, y
          # `releases/latest` es lo que resuelve el canal `stable` de los dos
          # instaladores. Marcar por "cualquier tag con guión" dejaba TODAS
          # las versiones etiquetadas como prerelease, así que `stable` se
          # quedó sirviendo `v0.0.0-dogfood.7` — un build de dogfood— durante
          # las siete alphas. Beta y final son releases completas y sí deben
          # poder ser «latest» (ADR-0010).
          case "${GITHUB_REF_NAME}" in
            *-alpha.*|*-rc.*|*-dogfood.*)
              release_flags+=(--prerelease)
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            "${release_flags[@]}"
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release/*
