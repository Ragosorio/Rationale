id: constraint.kind-inferred-from-record-id-prefix
kind: constraint
severity: high
statement: Cuando finalize_change no recibe kind explícito, debe derivarse del prefijo del record_id (constraint./decision./risk./exception.) en vez de defaultear siempre a "constraint"; un kind declarado que contradice el prefijo se rechaza. doctor detecta la discrepancia como KindMismatch, reparable solo con confirmación humana explícita por Record.
rationale: 'finalize_change defaulteaba kind a "constraint" siempre que el caller no lo declaraba, así que un record_id: decision.* podia escribirse con kind: constraint en silencio (el defecto real que rompió CI: una decisión aprobada se servía como la constraint crítica más relevante de un packet). Ahora kind se deriva del prefijo de record_id cuando no se declara explícito, y se rechaza si el kind declarado contradice el prefijo. Se añade doctor::Finding::KindMismatch reparable con confirmación humana (review::RecordMutation::CorrectKind), y se corrigieron los dos Records de este canon que tenían kind: constraint con id decision.*'
epistemic_status: stated
