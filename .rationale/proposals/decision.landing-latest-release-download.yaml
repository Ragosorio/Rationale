id: decision.landing-latest-release-download
kind: decision
severity: medium
statement: The landing page must download Rationale through GitHub's releases/latest alias so the displayed install command remains valid as new latest releases are published.
rationale: Use the GitHub latest release alias for the landing-page installer and keep the public release-status copy version-agnostic, while allowing the documentation guard to validate that stable alias.
