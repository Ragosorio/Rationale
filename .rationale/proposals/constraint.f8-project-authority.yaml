id: constraint.f8-project-authority
kind: constraint
severity: high
statement: Approval authority must be resolved exclusively from project configuration; undeclared actors are contributors, and approving a Record never elevates their role.
rationale: Configuration resolution records whether an actor is declared, lifecycle mutations reject undeclared reviewers, and a new authority must already be declared by the project.
