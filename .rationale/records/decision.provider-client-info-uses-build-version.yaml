id: decision.provider-client-info-uses-build-version
kind: decision
severity: low
statement: The MCP initialize request Rationale sends to Codebase Memory advertises clientInfo.version from RATIONALE_BUILD_VERSION (the artifact version set by build.rs), never CARGO_PKG_VERSION.
rationale: Cargo.toml keeps version 0.0.0 as a placeholder because the release version comes from the tag through build.rs; using CARGO_PKG_VERSION made every installed 1.0 binary introduce itself to the provider as 0.0.0, which is false provenance in the provider's logs and in any capability negotiation keyed on the client version.
