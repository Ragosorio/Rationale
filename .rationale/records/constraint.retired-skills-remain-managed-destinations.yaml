id: constraint.retired-skills-remain-managed-destinations
kind: constraint
severity: high
statement: A skill for a pre-made action that Rationale no longer offers must stay a recognized managed destination, and install-agent may delete it only while it still has the content hash Rationale recorded; without a recorded hash only --refresh-skills removes it.
rationale: Manifests written by earlier installs outlive a release. If a retired skill path stopped being recognized, uninstall-agent would reject the entire manifest as an unmanaged path and could not revert anything; deleting the skill without hash proof could destroy a user's edit, and skills committed to a repository have no local manifest at all.
