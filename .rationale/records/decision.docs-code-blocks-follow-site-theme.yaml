id: decision.docs-code-blocks-follow-site-theme
kind: decision
severity: low
statement: Markdown code blocks use Shiki dual themes (github-light and github-dark) with defaultColor false, so Shiki writes no inline background and the site CSS maps --shiki-light or --shiki-dark by data-theme.
rationale: With Astro's default single theme Shiki inlines background-color:#24292e on every block, which overrides the site tokens and leaves dark GitHub blocks on the light theme. Removing the default color is what lets the block background come from --surface-inset and the syntax colors follow the chosen theme.
