id: constraint.site-diagrams-come-from-the-code-graph
kind: constraint
severity: medium
statement: The site's architecture and working-subgraph diagrams may only draw nodes and edges that exist in Codebase Memory's call graph (and Record counts returned by explain_target) at the revision named in their caption; when the code's wiring changes they must be re-derived from the graph, never adjusted by hand to look right.
rationale: Rationale's whole claim is truthful context for agents; the landing says these figures are the binary's real wiring drawn from its own call graph. An invented or stale edge would make the marketing page contradict the product, and the caption's revision is what lets a reader and a future agent check the drawing against the code.
