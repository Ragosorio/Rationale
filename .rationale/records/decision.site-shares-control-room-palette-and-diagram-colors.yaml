id: decision.site-shares-control-room-palette-and-diagram-colors
kind: decision
severity: low
statement: The landing page and the documentation site default to a dark theme built on the Control Room's palette (deep background, blue accent, amber for what the canon explains), keep a light theme as an explicit user choice, and draw role and structural-state colors in diagrams with the Control Room's role and state tokens.
rationale: 'The site shows the product: the working-subgraph diagram, the relationship-state table and the loop use the same role, state and causal colors as rationale ui, so a visitor learns one visual language instead of two. The tokens live once in global.css with light and dark values, so docs, landing and SVG figures switch theme together without duplicated styles.'
