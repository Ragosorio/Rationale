evidence:
  - type: research-note
    path: docs/research/codebase-memory/07-storage-and-cache.md
    verified: true
  - type: research-note
    path: docs/research/codebase-memory/12-integration-recommendation.md
    verified: true
  - type: research-note
    path: docs/research/codebase-memory/00-source-lock.md
    verified: true

applicability_policy:
  superseded_by: null
  review_conditions:
    - Codebase Memory publishes a stable, versioned schema for its internal
      storage with an explicit compatibility guarantee.
    - Rationale adopts a provider whose only integration path is direct
      storage access.

binding_policy:
  structural_refactors: repair-silently
  behavioral_changes: revalidate
  conceptual_conflicts: advisory-unless-exact

context_policy:
  priority: critical
  always_include:
    - constraint.no-provider-internal-access
  max_default_tokens: 200

sensitivity:
  classification: internal
  visibility: repository
