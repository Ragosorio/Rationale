id: decision.retired-prompts-name-their-replacement
kind: decision
severity: low
statement: An MCP prompts/get for a retired action returns an invalid-params error that names what replaced it, never a bare unknown-prompt error, and the retired action is never offered again in prompts/list.
rationale: Clients expose MCP prompts as commands users remember (for example a review command from the approval-queue era); after an upgrade the only useful answer is the replacement path, while offering the old prompt again would reinstall a workflow vNext removed.
