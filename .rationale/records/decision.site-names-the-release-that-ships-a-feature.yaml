id: decision.site-names-the-release-that-ships-a-feature
kind: decision
severity: medium
statement: Website and documentation copy that describes behavior on main but not yet in releases/latest must say which release ships it, and must keep offering a path that works with the published binary.
rationale: Every install command on the site downloads releases/latest, so presenting unreleased behavior as available would hand users commands and files their installed binary does not have. Naming the release keeps the page true for the version people actually install, and the note is the one place to update when that release is cut.
