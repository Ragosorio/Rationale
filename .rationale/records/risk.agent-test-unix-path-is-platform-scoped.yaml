id: risk.agent-test-unix-path-is-platform-scoped
kind: risk
severity: medium
statement: Las pruebas que simulan ausencia de binarios mediante un PATH formado por rutas Unix solo deben compilarse y ejecutarse en Unix; en Windows esas rutas eliminan también git y la mutación global puede romper pruebas paralelas.
rationale: Evitar que un test basado en un PATH Unix rompa de forma no determinista la suite de Windows antes de publicar v0.1.0-beta.2.
