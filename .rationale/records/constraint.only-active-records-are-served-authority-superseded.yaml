id: constraint.only-active-records-are-served-authority-superseded
kind: constraint
severity: critical
statement: Only active Records are served as authority; superseded, revoked and retired Records are served as history with their status and current replacement, and supersession is derived from both sides of the relationship.
rationale: explain_target served superseded Records next to their replacements with no status, and retrieval missed Records replaced only through the new Record's supersedes; an agent given both picks either one.
