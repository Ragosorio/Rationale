id: decision.the-landing-demo-shows-abridged-responses-produced
kind: decision
severity: medium
statement: The landing demo shows abridged responses produced by the development binary on the invented eval/fixtures/parcel project and labels them as a simulated example; it never shows a real team's canon, and its numbers are not presented as customer results.
rationale: The demo exists to show what an agent receives in each failure case. Excerpts from a real team's canon would expose their data and read as customer results; the evaluation fixture keeps every excerpt reproducible with eval/run_eval.py, so the label can be literal.
