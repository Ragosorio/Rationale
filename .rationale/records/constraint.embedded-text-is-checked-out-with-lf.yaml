id: constraint.embedded-text-is-checked-out-with-lf
kind: constraint
severity: high
statement: Text the binary embeds with include_str!, the rationale skill and docs/prompt-master.md, is checked out with LF on every platform through .gitattributes, and a test fails when an embedded file contains a carriage return.
rationale: Git on Windows converts text to CRLF by default and include_str! embeds the checkout's bytes, so the Windows binary would install different skill content and hashes than macOS and Linux, and install-agent would treat skill files a teammate committed from another platform as edited. It first surfaced as a Windows-only CI failure of the SKILL.md frontmatter test.
