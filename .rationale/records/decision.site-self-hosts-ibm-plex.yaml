id: decision.site-self-hosts-ibm-plex
kind: decision
severity: low
statement: The site uses IBM Plex Sans for text and IBM Plex Mono only for code, commands, paths and identifiers, both self-hosted through @fontsource packages; it loads no fonts from third-party CDNs.
rationale: A local-first product that promises no telemetry should not make every visit call a font CDN, and the previous unloaded Inter stack fell back to the platform sans, which read as a generic template. Reserving mono for real code keeps it from becoming a 'technical' costume.
