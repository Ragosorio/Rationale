id: decision.when-the-structural-index-does-not-confirm
kind: decision
severity: high
statement: When the structural index does not confirm a symbol that the file defines, capture binds the Record to the symbol lexically (symbol, no structural_id) instead of to the whole file, and never invents a structural identity.
rationale: A stale index made Records for symbols new on the branch fall back to file bindings, which then governed every symbol in the file; a structural_id the provider never confirmed would break policy.no-inferred-blocks.
