id: constraint.release-binaries-embed-control-room
kind: constraint
severity: high
statement: Every release target must build the Control Room (ui/dist) before compiling the binary, and the release workflow must fail when ui/dist is missing instead of packaging.
rationale: build.rs embeds ui/dist into the binary and silently falls back to an instructions page when it is absent, so a release built without the frontend would still compile, pass tests and publish a rationale ui that shows no Control Room. Only an explicit build step with an existence check turns that silent degradation into a failed release.
