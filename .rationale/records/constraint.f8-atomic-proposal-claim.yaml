id: constraint.f8-atomic-proposal-claim
kind: constraint
severity: high
statement: Promotion or rejection of a pending proposal must begin with an atomic exclusive claim; concurrent losers fail explicitly, and interrupted claims remain recoverable.
rationale: The review path claims the exact pending file with an atomic rename, validates its bytes again, and leaves interrupted work in proposals/.in-review/.
