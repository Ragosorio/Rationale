id: decision.doctor-check-fails-only-findings-above-fail
kind: decision
severity: high
statement: doctor --check fails only on findings at or above --fail-on that are not in the committed baseline; known findings are still printed and resolved ones are reported.
rationale: A check that fails on any finding cannot run in CI on a project with known debt, and a baseline that hid known findings would let regressions pass unnoticed.
