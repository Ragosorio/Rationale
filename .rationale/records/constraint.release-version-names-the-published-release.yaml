id: constraint.release-version-names-the-published-release
kind: constraint
severity: medium
statement: docs/RELEASE_VERSION names the Release that is published (or the tag about to be pushed), never a version that has not been tagged; changes merged to main after that Release are listed under an unreleased CHANGELOG section until their tag is cut.
rationale: RELEASE_VERSION is the single source that scripts/check-docs.sh compares documentation against, and the release workflow's verify job refuses to package unless it equals the pushed tag. Bumping it ahead of a Release made main claim a v1.0.1 that did not exist while the site, installer channel and published binaries were v1.0.0.
