id: constraint.file-binding-that-accompanies-symbol-binding-the
kind: constraint
severity: high
statement: 'A file binding that accompanies a symbol binding of the same file never makes a Record govern the file''s other symbols; only a file declared on its own, or marked scope: file, governs every symbol in it.'
rationale: Up to v1.1 every path::symbol binding also wrote a companion file binding, so a Record about one function was served for every function of its file.
