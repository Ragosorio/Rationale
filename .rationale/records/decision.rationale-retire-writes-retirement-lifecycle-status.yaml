id: decision.rationale-retire-writes-retirement-lifecycle-status
kind: decision
severity: high
statement: rationale retire writes a retirement as lifecycle status revoked with a retired event, unbinds Records still bound to current code, never touches pinned Records, and keeps a local batch so undo restores every byte.
rationale: Binaries before 1.2 only know revoked, so they must read a retirement as inactive; a retired module left 116 active Records in the reported project and a silent heuristic would have deleted valid decisions.
