id: decision.site-master-prompt-has-one-text
kind: decision
severity: medium
statement: Both locales of the website render the master prompt from docs/prompt-master.md, the English text that install-agent writes, and no translated copy of it is kept.
rationale: A site-only Spanish translation already fell a step behind once, so Spanish readers were shown instructions different from the ones their agent had installed. The protocol tells the agent to reply in the user's language, so a single installed text serves every team and cannot drift from what the site shows.
