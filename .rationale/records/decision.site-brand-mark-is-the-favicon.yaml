id: decision.site-brand-mark-is-the-favicon
kind: decision
severity: low
statement: 'Every brand mark on the site (landing header and footer, docs header) is the favicon drawing unchanged: a square frame with R/ in #f0f1ed on #101516, in both themes.'
rationale: The owner asked that the site's SVG stay R/ like the icon, so the tab, header and footer carry one identity; a separate decorative mark (the previous orbit-and-dot glyph) read as a different product and as generic AI styling.
