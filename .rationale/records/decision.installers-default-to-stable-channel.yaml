id: decision.installers-default-to-stable-channel
kind: decision
severity: high
statement: From 1.0 the shell and PowerShell installers and the update helpers default to the stable channel (GitHub releases/latest); preview stays available only through RATIONALE_CHANNEL.
rationale: ADR-0010 distinguished stable and preview only while Rationale was pre-1.0, because stable then resolved to an outdated release. With a stable 1.0 published, defaulting to preview would hand any later -rc or -alpha pre-release to every new install and update that never asked for it.
