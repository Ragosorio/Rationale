id: decision.mcp-registration-identifies-the-client
kind: decision
severity: high
statement: Each supported client's global MCP registration runs `serve --client <claude-code|codex|cursor>`; install migrates a plain `serve` entry of the same binary, and uninstall removes either form for that binary but never an entry with any other arguments.
rationale: 'The flag gives each session a client identity that does not depend on initialize.clientInfo, which clients may omit or name inconsistently, so local activity and rationale ui attribute work to the right agent. Pre-vNext installs registered plain `serve`: recognizing both forms keeps install convergent and uninstall complete under ADR-0016, while other arguments are user configuration.'
