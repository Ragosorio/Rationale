id: decision.site-avoids-generated-ui-tropes
kind: decision
severity: low
statement: The site does not use eyebrow kickers above headings, gradient text, glow or zero-offset halo shadows, glass blur, colored side borders thicker than 1px, fake window chrome or tickers, identical icon card grids, hero metric strips, or unicode glyphs as icons; structure comes from hairline rules, 2px corners that echo the R/ frame, type weight and meaningful color.
rationale: The owner asked that no page look AI-generated; these are the patterns the impeccable craft floor and detector flag as generated-UI tells, and the previous landing used most of them. The pass was verified with impeccable detect reporting 0 findings on site/src (7 before).
