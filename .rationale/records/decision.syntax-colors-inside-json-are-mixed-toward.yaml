id: decision.syntax-colors-inside-json-are-mixed-toward
kind: decision
severity: low
statement: Syntax colors inside .l-json are mixed toward --ink so keys and states reach 4.5:1 contrast in both themes; the plain brand tokens are only the fallback for browsers without color-mix.
rationale: At 0.8rem the brand tokens --signal, --state-observed and --state-indirect measured 4.1 to 4.4:1 on the light code background, below WCAG AA for normal text. Darkening the global tokens instead would shift the brand and the diagrams that share them.
