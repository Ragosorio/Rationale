schema_version: rationale/0.1

id: review.proposal-lifecycle-integrity
type: system-behavior
title: Pending proposal and Record lifecycle preserve review integrity
scope: project
aliases:
  - review.atomic-proposal-claim
  - review.record-lifecycle
applies_to:
  - project

description: >
  A pending proposal is an untrusted, reviewable claim until a human
  explicitly promotes it. The claim must be exclusive and recoverable, and
  every later correction, dispute, revocation, supersession, authority
  change, or evidence addition must remain an auditable canonical event. A
  stale copy must never overwrite a newer proposal or Record.

source:
  - Rationale_v0.5.md §5, §10, §15.5, §21
  - docs/work-items/adversarial-review-fase-f.md
  - docs/work-items/fase-g-dogfood.md

