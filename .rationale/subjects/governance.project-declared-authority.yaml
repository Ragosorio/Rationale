schema_version: rationale/0.1

id: governance.project-declared-authority
type: system-behavior
title: Project configuration is the sole source of review authority
scope: project
aliases:
  - governance.no-auto-elevation
  - governance.authority-resolution
applies_to:
  - project

description: >
  Approval and Record lifecycle authority are resolved from the project's
  canonical configuration. An undeclared actor is a contributor by default,
  cannot auto-elevate itself, and cannot assign authority to another
  undeclared actor. Historical approvals remain evidence even when a Record
  is revoked; they do not silently restore authority.

source:
  - Rationale_v0.5.md §10.6, §15.5, §21
  - docs/work-items/adversarial-review-fase-f.md
  - docs/work-items/fase-g-dogfood.md

