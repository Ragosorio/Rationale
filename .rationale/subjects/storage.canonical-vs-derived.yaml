schema_version: rationale/0.1

id: storage.canonical-vs-derived
type: system-behavior
title: Canonical Git layer is separate from the regenerable local index
scope: project
aliases:
  - storage.shared-vs-local
applies_to:
  - project

description: >
  Subjects, Records, Binding declarations, Approvals and supersession
  events are canonical, portable, versioned in Git under `.rationale/`,
  and shared by the team. Binding resolutions, assessments, FTS indices
  and caches are a derived local layer, regenerable per machine, not
  necessarily versioned, and may legitimately differ between two
  computers due to provider version, platform, or index state. The
  derived layer must never be the only copy of a decision, and a stale
  or incomplete local index must never be versioned as a global fact.

source:
  - Rationale_v0.5.md §4.19, §26.1-26.4
  - Rationale_Arquitectura_Conceptual_v0.1.md §10.1-10.2

